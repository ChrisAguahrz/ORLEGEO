<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrleGEO // Tactical Command Matrix</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-magenta: #ff0055;
            --cyber-dark: rgba(6, 10, 20, 0.9);
            --neon-glow: 0 0 15px rgba(0, 243, 255, 0.6);
        }
        
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Courier New', monospace; background: #020205; color: #fff; overflow: hidden; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; height: 100%; background: #030308; }

        /* Sci-Fi HUD Outlines */
        .hud-glass {
            position: absolute; background: var(--cyber-dark); border: 2px solid var(--neon-cyan);
            box-shadow: var(--neon-glow); backdrop-filter: blur(12px); border-radius: 0px; padding: 15px; z-index: 1000;
        }

        #top-header { top: 15px; left: 15px; right: 15px; height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
        .matrix-title { font-size: 22px; font-weight: bold; letter-spacing: 3px; color: var(--neon-cyan); text-shadow: var(--neon-glow); }

        #control-panel { top: 95px; left: 15px; width: 340px; max-height: 75vh; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        
        .search-container { display: flex; gap: 5px; }
        input, select { flex: 1; background: rgba(0,0,0,0.8); border: 1px solid var(--neon-cyan); color: var(--neon-cyan); padding: 10px; font-family: monospace; }
        input:focus, select:focus { border-color: var(--neon-magenta); outline: none; box-shadow: 0 0 8px var(--neon-magenta); }
        
        button { background: transparent; border: 1px solid var(--neon-cyan); color: var(--neon-cyan); font-family: monospace; padding: 10px 15px; cursor: pointer; font-weight: bold; transition: all 0.2s; }
        button:hover { background: var(--neon-cyan); color: #000; box-shadow: var(--neon-glow); }
        .btn-danger { border-color: var(--neon-magenta); color: var(--neon-magenta); }
        .btn-danger:hover { background: var(--neon-magenta); color: #000; box-shadow: 0 0 10px var(--neon-magenta); }

        .inspector-card { border-top: 1px solid rgba(0, 243, 255, 0.4); margin-top: 10px; padding-top: 10px; display: none; }
        .asset-img { width: 100%; border: 1px solid var(--neon-magenta); margin-top: 10px; display: none; }

        /* QGIS Editor Panel */
        #qgis-panel { top: 95px; right: 15px; width: 320px; display: none; }
        .field-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
        .field-group label { font-size: 11px; color: #88a8b8; text-transform: uppercase; letter-spacing: 1px; }

        /* Override Leaflet Draw UI to match Cyber Aesthetics */
        .leaflet-draw-toolbar a { background-color: var(--cyber-dark) !important; border-bottom: 1px solid var(--neon-cyan) !important; color: var(--neon-cyan) !important; }
    </style>
</head>
<body>

<div id="map"></div>

<div id="top-header" class="hud-glass">
    <div class="matrix-title">OrleGEO // ORLAND CRITICAL MAP ENGINE</div>
    <div style="font-size: 11px; color: #ff0055; font-weight: bold;" id="system-status">INITIALIZING SYSTEMS...</div>
</div>

<div id="control-panel" class="hud-glass">
    <div>
        <div class="field-group"><label>Query Registry (Name / Batch Lat,Lng)</label></div>
        <div class="search-container">
            <input type="text" id="search-query" placeholder="Search county or 'Lat,Lng'...">
            <button onclick="executeMatrixSearch()">SCAN</button>
        </div>
    </div>

    <div id="inspector" class="inspector-card">
        <h3 id="inspect-name" style="margin:0 0 10px 0; color: var(--neon-magenta); text-shadow: 0 0 5px var(--neon-magenta);">Entity Name</h3>
        <p style="font-size:12px; margin: 5px 0;"><strong>Layer Space:</strong> <span id="inspect-layer" style="color:var(--neon-cyan)">-</span></p>
        <p style="font-size:12px; margin: 5px 0;"><strong>Category:</strong> <span id="inspect-category">-</span></p>
        <p style="font-size:12px; margin: 5px 0;"><strong>Tracking ID:</strong> <span id="inspect-ref">-</span></p>
        <div id="inspect-dimensions" style="font-size:11px; color:#a2cad6; background:rgba(0,0,0,0.6); padding:8px; margin-top:8px; border-left: 2px solid var(--neon-cyan);"></div>
        <img id="inspect-image" class="asset-img" src="" alt="External Asset Sync">
    </div>
</div>

<div id="qgis-panel" class="hud-glass">
    <h3 style="margin:0 0 15px 0; color:var(--neon-cyan); font-size:13px; letter-spacing:1px; text-shadow: var(--neon-glow);">NEW VECTOR DETECTION ENTRY</h3>
    
    <div class="field-group">
        <label>Entity Designation Name</label>
        <input type="text" id="node-name" placeholder="E.g., Great Orland Lake">
    </div>
    <div class="field-group">
        <label>Classification Category</label>
        <select id="node-category" onchange="adaptFormBySelection()">
            <option value="city">City / Urban Sector</option>
            <option value="lake">Lake / Hydro Graphic</option>
            <option value="mountain">Mountain / Elevation Ridge</option>
            <option value="road">Transport Route / Freeway</option>
            <option value="police_station">Security Grid Command</option>
        </select>
    </div>
    <div class="field-group">
        <label>Layer Partition Target</label>
        <select id="node-layer">
            <option value="default_layer">Default Baseline Layer</option>
            <option value="custom_user_layer">New Custom Vector Layer</option>
        </select>
    </div>
    <div class="field-group">
        <label>Asset Image Link Only</label>
        <input type="text" id="node-img-url" placeholder="https://domain.com/photo.jpg">
    </div>
    <div class="field-group">
        <label>Reference Verification Code</label>
        <input type="text" id="node-ref" placeholder="REF-424-X">
    </div>

    <div id="dynamic-metrics-zone"></div>

    <div style="display:flex; gap:10px; margin-top:15px;">
        <button class="btn-danger" style="flex:1" onclick="cancelDrawingWorkflow()">ABORT</button>
        <button style="flex:2" onclick="commitNodeToSupabase()">SAVE TO SUPABASE</button>
    </div>
</div>

<script>
    // System Configurations
    const SUPABASE_URL = "https://sgfhjqfkbumsphevxlrc.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_dCaPTVDjHAXrxH307dTk0g_p_ngBhud";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let githubLayerData = null; 
    let supabaseLayer = null;
    let activeDrawnLayer = null;

    // Initialize Map with clean Ultra-Modern Minimalist Obsidian style tile array
    const map = L.map('map', { zoomControl: false }).setView([28.5383, -81.3792], 6);

    // Dark Cyberpunk Grid Tile Layer
    L.tileLayer('https://tiles.stadiamaps.com/tiles/alidade_smooth_dark/{z}/{x}/{y}{r}.png', {
        maxZoom: 20,
        attribution: 'OrleGEO Matrix Systems'
    }).addTo(map);

    // Mount Leaflet Draw Engine Configs (Provides QGIS multi-point polygon vector execution)
    const drawnItems = new L.FeatureGroup();
    map.addLayer(drawnItems);
    const drawControl = new L.Control.Draw({
        edit: { featureGroup: drawnItems, remove: true },
        draw: { polygon: true, polyline: true, marker: true, rectangle: true, circle: false }
    });
    map.addControl(drawControl);

    // Initial Database Run Check
    window.addEventListener('DOMContentLoaded', async () => {
        document.getElementById('system-status').innerText = "FETCHING REPOSITORY DATA...";
        await loadGitHubGeoJSON();
        await syncLiveSupabaseLayers();
    });

    // 1. DYNAMIC GITHUB INTEGRATION DEPLOYMENT
    async function loadGitHubGeoJSON() {
        const url = "https://raw.githubusercontent.com/ChrisAguahrz/ORLEGEO/main/%28R%29%20ORLAND%20424%20STATES.geojson";
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error("Matrix configuration unreadable at remote origin.");
            const geojson = await response.json();

            githubLayerData = L.geoJSON(geojson, {
                style: {
                    color: "#00f3ff",
                    weight: 1.5,
                    fillColor: "#9d00ff",
                    fillOpacity: 0.12
                },
                onEachFeature: (feature, layer) => {
                    layer.on('click', () => {
                        highlightFeatureDirect(layer, feature.properties);
                    });
                }
            }).addTo(map);

            // Fit camera viewpoint automatically onto your coordinate grid bounds
            map.fitBounds(githubLayerData.getBounds());
            document.getElementById('system-status').innerText = "GITHUB LAYERS OPERATIONAL";
        } catch (err) {
            console.error(err);
            document.getElementById('system-status').innerText = "REPOSITORY SYNC FAILURE";
        }
    }

    // 2. SUPABASE COMPONENT SYNCHRONIZATION AND RENDERING (Keeps data persistent on reload)
    async function syncLiveSupabaseLayers() {
        try {
            if (supabaseLayer) map.removeLayer(supabaseLayer);

            const { data, error } = await supabase.rpc('get_orlegeo_geojson');
            if (error) throw error;

            if (data && data.features) {
                supabaseLayer = L.geoJSON(data, {
                    style: (feature) => {
                        // Dynamically morph color palette based on feature category selections
                        let catColor = "#00f3ff"; // Base Cyan
                        if (feature.properties.category === 'lake') catColor = "#0055ff"; // Ocean Blue
                        if (feature.properties.category === 'mountain') catColor = "#ffaa00"; // Peak Amber
                        if (feature.properties.category === 'city') catColor = "#ff0055"; // Hot Crimson Neon

                        return {
                            color: "#ffffff",
                            weight: 2,
                            fillColor: catColor,
                            fillOpacity: 0.55
                        };
                    },
                    onEachFeature: (feature, layer) => {
                        layer.on('click', () => {
                            renderInspectorHUD(
                                feature.properties.name,
                                feature.properties.layer_type,
                                feature.properties.category,
                                feature.properties.reference_number,
                                feature.properties.image_url,
                                feature.properties.dimensions
                            );
                        });
                    }
                }).addTo(map);
            }
        } catch (err) {
            console.error("Supabase dynamic render fault:", err);
        }
    }

    // Handle Completed QGIS Drawing Vector Inputs
    map.on(L.Draw.Event.CREATED, function (e) {
        activeDrawnLayer = e.layer;
        drawnItems.addLayer(activeDrawnLayer);
        document.getElementById('qgis-panel').style.display = 'block';
        adaptFormBySelection();
    });

    function adaptFormBySelection() {
        const category = document.getElementById('node-category').value;
        const container = document.getElementById('dynamic-metrics-zone');
        let html = '';

        if (category === 'lake') {
            html = `
                <div class="field-group"><label>Depth Value (Meters)</label><input type="number" id="dim-depth" value="80"></div>
                <div class="field-group"><label>Calculated Size Area (Sq KM)</label><input type="number" id="dim-size" value="450"></div>`;
        } else if (category === 'mountain') {
            html = `<div class="field-group"><label>Peak Ridge Elevation (m)</label><input type="number" id="dim-height" value="4200"></div>`;
        } else if (category === 'road') {
            html = `<div class="field-group"><label>Structural Width (Lanes)</label><input type="number" id="dim-width" value="4"></div>`;
        }
        container.innerHTML = html;
    }

    // COMMITS DATA DIRECTLY TO SUPABASE (Will survive app refreshes)
    async function commitNodeToSupabase() {
        if (!activeDrawnLayer) return;

        const name = document.getElementById('node-name').value || "Unnamed Object Vector";
        const category = document.getElementById('node-category').value;
        const layer_type = document.getElementById('node-layer').value;
        const image_url = document.getElementById('node-img-url').value;
        const reference_number = document.getElementById('node-ref').value;

        let dimensions = {};
        if (document.getElementById('dim-depth')) dimensions.depth = document.getElementById('dim-depth').value;
        if (document.getElementById('dim-size')) dimensions.size = document.getElementById('dim-size').value;
        if (document.getElementById('dim-height')) dimensions.height = document.getElementById('dim-height').value;
        if (document.getElementById('dim-width')) dimensions.width = document.getElementById('dim-width').value;

        // Convert the structural drawn vector properties straight to standard GeoJSON
        const geojsonStructure = activeDrawnLayer.toGeoJSON();

        const payload = {
            name, category, layer_type, image_url, reference_number, dimensions,
            geom: geojsonStructure.geometry
        };

        const { data, error } = await supabase.from('orlegeo_map_objects').insert([payload]);

        if (error) {
            alert("Database write error: " + error.message);
        } else {
            document.getElementById('qgis-panel').style.display = 'none';
            drawnItems.clearLayers();
            await syncLiveSupabaseLayers(); // Instantly update active view maps
        }
    }

    // High Performance Structural Search: Handles explicit naming strings OR dynamic batch coordinates
    async function executeMatrixSearch() {
        const query = document.getElementById('search-query').value.trim();
        if (!query) return;

        const batchCoordsRegex = /^[-+]?([1-9]?\d(\.\d+)?|90(\.0+)?),\s*[-+]?(180(\.0+)?|((1[0-7]\d)|([1-9]?\d))(\.\d+)?)$/;

        if (batchCoordsRegex.test(query)) {
            const [lat, lng] = query.split(',').map(Number);
            map.setView([lat, lng], 14);
            L.circle([lat, lng], { color: '#ff0055', radius: 300 }).addTo(map);
            renderInspectorHUD("Target Coordinates Node Locked", "Manual Input Coordinates Layer", "Injected Vector Node", "N/A", "");
            return;
        }

        // Scan GitHub Layers
        let found = false;
        if (githubLayerData) {
            githubLayerData.eachLayer((layer) => {
                if (layer.feature.properties.name && layer.feature.properties.name.toLowerCase().includes(query.toLowerCase())) {
                    map.fitBounds(layer.getBounds());
                    highlightFeatureDirect(layer, layer.feature.properties);
                    found = true;
                }
            });
        }

        if (!found) {
            // Check Supabase if missing from base files
            const { data, error } = await supabase.from('orlegeo_map_objects').select('*').ilike('name', `%${query}%`).maybeSingle();
            if (data) {
                const tempLayer = L.geoJSON(data.geom);
                map.fitBounds(tempLayer.getBounds());
                renderInspectorHUD(data.name, data.layer_type, data.category, data.reference_number, data.image_url, data.dimensions);
            } else {
                alert("Vector footprint absent across global networks.");
            }
        }
    }

    function highlightFeatureDirect(layer, props) {
        // Flash targeted element with highlight colors
        layer.setStyle({ color: '#ff0055', weight: 3, fillOpacity: 0.4 });
        setTimeout(() => { githubLayerData.resetStyle(layer); }, 4000);

        renderInspectorHUD(
            props.name || "Unknown County Entity",
            "GitHub Repository Baseline",
            props.category || "County Division Block",
            props.id || "Unassigned",
            props.image_link || ""
        );
    }

    function renderInspectorHUD(name, layer, cat, ref, imgUrl, dimensions = {}) {
        document.getElementById('inspector').style.display = 'block';
        document.getElementById('inspect-name').innerText = name;
        document.getElementById('inspect-layer').innerText = layer;
        document.getElementById('inspect-category').innerText = cat;
        document.getElementById('inspect-ref').innerText = ref;

        let dimBox = document.getElementById('inspect-dimensions');
        if (Object.keys(dimensions).length > 0) {
            dimBox.style.display = 'block';
            dimBox.innerHTML = `<strong>Feature Metrics Array:</strong><br>` + Object.entries(dimensions).map(([k,v]) => `${k.toUpperCase()}: ${v}`).join('<br>');
        } else {
            dimBox.style.display = 'none';
        }

        let imgEl = document.getElementById('inspect-image');
        if (imgUrl && imgUrl.startsWith('http')) {
            imgEl.src = imgUrl;
            imgEl.style.display = 'block';
        } else {
            imgEl.style.display = 'none';
        }
    }

    function cancelDrawingWorkflow() {
        document.getElementById('qgis-panel').style.display = 'none';
        drawnItems.clearLayers();
    }
</script>
</body>
</html>
