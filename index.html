<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OrleGEO // Map</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-dark: #121214;
            --panel-bg: rgba(24, 24, 27, 0.95);
            --accent-cyan: #00f3ff;
            --accent-pink: #ff0055;
            --border-line: rgba(255, 255, 255, 0.1);
        }
        
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg-dark); color: #f4f4f5; overflow: hidden; }
        
        #map { position: absolute; top: 0; bottom: 0; width: 100%; height: 100%; z-index: 1; }

        /* Top Bar Navigation */
        .top-bar {
            position: absolute; top: 10px; left: 10px; right: 10px; height: 50px;
            background: var(--panel-bg); border: 1px solid var(--border-line);
            border-radius: 8px; display: flex; align-items: center; justify-content: space-between;
            padding: 0 15px; z-index: 1000; backdrop-filter: blur(10px);
        }
        .main-title { font-size: 16px; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
        .status-dot { font-size: 11px; color: var(--accent-cyan); font-weight: 500; }

        /* Floating Controls & Content Panels */
        .floating-hud {
            position: absolute; bottom: 20px; left: 10px; right: 10px;
            background: var(--panel-bg); border: 1px solid var(--border-line);
            border-radius: 12px; padding: 15px; z-index: 1000;
            max-height: 40vh; overflow-y: auto; backdrop-filter: blur(10px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        /* Forms, Inputs and Buttons */
        .search-row { display: flex; gap: 8px; margin-bottom: 10px; }
        input, select {
            flex: 1; background: #09090b; border: 1px solid var(--border-line);
            color: #fff; padding: 12px; border-radius: 6px; font-size: 14px; -webkit-appearance: none;
        }
        input:focus, select:focus { border-color: var(--accent-cyan); outline: none; }
        
        button {
            background: var(--accent-cyan); color: #000; border: none; font-weight: 600;
            padding: 12px 18px; border-radius: 6px; font-size: 14px; cursor: pointer; transition: background 0.2s;
        }
        button:active { opacity: 0.8; }
        .btn-cancel { background: #27272a; color: #fff; margin-right: 8px; }

        /* Details Card Components */
        .info-card { display: none; border-top: 1px solid var(--border-line); margin-top: 12px; padding-top: 12px; }
        .info-title { font-size: 18px; font-weight: 700; color: var(--accent-cyan); margin: 0 0 8px 0; }
        .info-meta { font-size: 13px; color: #a1a1aa; margin: 4px 0; }
        .info-img { width: 100%; max-height: 180px; object-fit: cover; border-radius: 6px; margin-top: 10px; display: none; border: 1px solid var(--border-line); }

        /* Creator Panel Overlay */
        #creator-panel { top: 70px; bottom: auto; display: none; max-height: 75vh; }
        .field-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
        .field-group label { font-size: 12px; color: #a1a1aa; font-weight: 500; }

        /* Clean up Leaflet native controls layout for Mobile screens */
        .leaflet-touch .leaflet-draw-toolbar { margin-top: 65px !important; }
    </style>
</head>
<body>

<div id="map"></div>

<div class="top-bar">
    <div class="main-title">OrleGEO Map</div>
    <div class="status-dot" id="system-status">Loading systems...</div>
</div>

<div id="control-panel" class="floating-hud">
    <div class="search-row">
        <input type="text" id="search-query" placeholder="Search a place or paste Lat,Lng...">
        <button onclick="searchMapMatrix()">Search</button>
    </div>

    <div id="inspector" class="info-card">
        <h3 id="inspect-name" class="info-title">Location Details</h3>
        <p class="info-meta"><strong>Layer Type:</strong> <span id="inspect-layer">-</span></p>
        <p class="info-meta"><strong>Category:</strong> <span id="inspect-category">-</span></p>
        <p class="info-meta"><strong>ID Number:</strong> <span id="inspect-ref">-</span></p>
        <div id="inspect-dimensions" style="font-size: 13px; color: #e4e4e7; background: #18181b; padding: 10px; margin-top: 8px; border-radius: 6px;"></div>
        <img id="inspect-image" class="info-img" src="" alt="Linked Map Preview Image">
    </div>
</div>

<div id="creator-panel" class="floating-hud">
    <h3 style="margin:0 0 15px 0; font-size:16px; color:#fff;">Add New Map Object</h3>
    
    <div class="field-group">
        <label>Object Name</label>
        <input type="text" id="node-name" placeholder="E.g., North Lake">
    </div>
    <div class="field-group">
        <label>Type Category</label>
        <select id="node-category" onchange="adjustFormFields()">
            <option value="city">City / Town District</option>
            <option value="lake">Lake / Water Body</option>
            <option value="mountain">Mountain / Elevation Ridge</option>
            <option value="road">Road / Main Highway</option>
            <option value="police_station">Police Station</option>
        </select>
    </div>
    <div class="field-group">
        <label>Map Layer Mapping</label>
        <select id="node-layer">
            <option value="default_layer">Default Baseline Layer</option>
            <option value="custom_layer">New Custom Layer Layer</option>
        </select>
    </div>
    <div class="field-group">
        <label>Image Link Only (No uploads)</label>
        <input type="text" id="node-img-url" placeholder="https://site.com/image.jpg">
    </div>
    <div class="field-group">
        <label>Reference Verification Code</label>
        <input type="text" id="node-ref" placeholder="REF-XXXX">
    </div>

    <div id="dynamic-metrics"></div>

    <div style="display:flex; justify-content: flex-end; margin-top:15px;">
        <button class="btn-cancel" onclick="closeDrawingWorkflow()">Cancel</button>
        <button onclick="saveObjectToSupabase()">Save to Supabase</button>
    </div>
</div>

<script>
    // Database credentials setup connection parameters
    const SUPABASE_URL = "https://sgfhjqfkbumsphevxlrc.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_dCaPTVDjHAXrxH307dTk0g_p_ngBhud";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let baseGithubLayer = null; 
    let dynamicSupabaseLayer = null;
    let newlyDrawnLayer = null;

    // Initialize map using completely free CartoDB Dark Matter tiles (No API key locks)
    const map = L.map('map', { zoomControl: false }).setView([0, 0], 2);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 20,
        attribution: '&copy; OpenStreetMap &copy; CARTO'
    }).addTo(map);

    // Setup map editor controls (QGIS Vector simulation styles)
    const drawnItemsGroup = new L.FeatureGroup();
    map.addLayer(drawnItemsGroup);
    const drawControl = new L.Control.Draw({
        edit: { featureGroup: drawnItemsGroup, remove: true },
        draw: { polygon: true, polyline: true, marker: true, rectangle: true, circle: false }
    });
    map.addControl(drawControl);

    // Trigger base loading events
    window.addEventListener('DOMContentLoaded', async () => {
        document.getElementById('system-status').innerText = "Loading data...";
        await loadRepositoryGeoJSON();
        await pullLiveSupabaseObjects();
    });

    // 1. IMPORT DATA DIRECTLY FROM YOUR CORRECT REPOSITORY LINK
    async function loadRepositoryGeoJSON() {
        // Direct absolute raw link constructed from the provided path parameters
        const url = "https://raw.githubusercontent.com/ChrisAguahrz/ORLEGEO/main/%28R%29%20ORLAND%20424%20STATES.geojson";
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error("File not found on repository branch.");
            const geojson = await response.json();

            baseGithubLayer = L.geoJSON(geojson, {
                style: {
                    color: "#00f3ff",
                    weight: 1.5,
                    fillColor: "#ff0055",
                    fillOpacity: 0.1
                },
                onEachFeature: (feature, layer) => {
                    layer.on('click', (e) => {
                        L.DomEvent.stopPropagation(e);
                        showActiveHighlight(layer, feature.properties);
                    });
                }
            }).addTo(map);

            // Center view safely to fit the file boundaries perfectly
            map.fitBounds(baseGithubLayer.getBounds());
            document.getElementById('system-status').innerText = "GitHub Loaded";
        } catch (err) {
            console.error(err);
            document.getElementById('system-status').innerText = "GitHub Load Error";
        }
    }

    // 2. READ LIVE BACKEND LAYERS OUT OF SUPABASE ON APP STARTS / RELOADS
    async function pullLiveSupabaseObjects() {
        try {
            if (dynamicSupabaseLayer) map.removeLayer(dynamicSupabaseLayer);

            const { data, error } = await supabase.rpc('get_orlegeo_geojson');
            if (error) throw error;

            if (data && data.features) {
                dynamicSupabaseLayer = L.geoJSON(data, {
                    style: (feature) => {
                        let trackingColor = "#00f3ff"; // Cyan base
                        if (feature.properties.category === 'lake') trackingColor = "#0055ff"; // Ocean styling color override
                        if (feature.properties.category === 'mountain') trackingColor = "#eab308"; // Gold Amber
                        if (feature.properties.category === 'city') trackingColor = "#ff0055"; // Hot pink

                        return {
                            color: "#ffffff",
                            weight: 2,
                            fillColor: trackingColor,
                            fillOpacity: 0.6
                        };
                    },
                    onEachFeature: (feature, layer) => {
                        layer.on('click', (e) => {
                            L.DomEvent.stopPropagation(e);
                            displayInspectorPanel(
                                feature.properties.name,
                                feature.properties.layer_type,
                                feature.properties.category,
                                feature.properties.reference_number,
                                feature.properties.image_url,
                                feature.properties.dimensions
                            );
                        });
                    }
                }).addTo(map);
            }
        } catch (err) {
            console.error("Database load error:", err);
        }
    }

    // Open editing view menu once vectors finish drawing on screen
    map.on(L.Draw.Event.CREATED, function (e) {
        newlyDrawnLayer = e.layer;
        drawnItemsGroup.addLayer(newlyDrawnLayer);
        document.getElementById('creator-panel').style.display = 'block';
        adjustFormFields();
    });

    function adjustFormFields() {
        const category = document.getElementById('node-category').value;
        const metricsBox = document.getElementById('dynamic-metrics');
        let htmlBlock = '';

        if (category === 'lake') {
            htmlBlock = `
                <div class="field-group"><label>Depth Value (Meters)</label><input type="number" id="dim-depth" value="50"></div>
                <div class="field-group"><label>Size Area (Sq KM)</label><input type="number" id="dim-size" value="150"></div>`;
        } else if (category === 'mountain') {
            htmlBlock = `<div class="field-group"><label>Peak Elevation Height (m)</label><input type="number" id="dim-height" value="2800"></div>`;
        } else if (category === 'road') {
            htmlBlock = `<div class="field-group"><label>Lanes Width</label><input type="number" id="dim-width" value="4"></div>`;
        }
        metricsBox.innerHTML = htmlBlock;
    }

    // SAVE OBJECT DATA AND VECTOR DATA DIRECTLY INTO SUPABASE (Survives browser reloads)
    async function saveObjectToSupabase() {
        if (!newlyDrawnLayer) return;

        const name = document.getElementById('node-name').value || "New Map Layer Node";
        const category = document.getElementById('node-category').value;
        const layer_type = document.getElementById('node-layer').value;
        const image_url = document.getElementById('node-img-url').value;
        const reference_number = document.getElementById('node-ref').value;

        let dimensions = {};
        if (document.getElementById('dim-depth')) dimensions.depth = document.getElementById('dim-depth').value;
        if (document.getElementById('dim-size')) dimensions.size = document.getElementById('dim-size').value;
        if (document.getElementById('dim-height')) dimensions.height = document.getElementById('dim-height').value;
        if (document.getElementById('dim-width')) dimensions.width = document.getElementById('dim-width').value;

        const geojsonFormat = newlyDrawnLayer.toGeoJSON();

        const payload = {
            name, category, layer_type, image_url, reference_number, dimensions,
            geom: geojsonFormat.geometry
        };

        const { data, error } = await supabase.from('orlegeo_map_objects').insert([payload]);

        if (error) {
            alert("Save failed: " + error.message);
        } else {
            document.getElementById('creator-panel').style.display = 'none';
            drawnItemsGroup.clearLayers();
            await pullLiveSupabaseObjects(); // Reload the layers into view automatically
        }
    }

    // Search Box Parsing Handling Engine
    async function searchMapMatrix() {
        const query = document.getElementById('search-query').value.trim();
        if (!query) return;

        // Coordinates check (E.g. 28.53, -81.37)
        const coordinatePattern = /^[-+]?([1-9]?\d(\.\d+)?|90(\.0+)?),\s*[-+]?(180(\.0+)?|((1[0-7]\d)|([1-9]?\d))(\.\d+)?)$/;

        if (coordinatePattern.test(query)) {
            const [lat, lng] = query.split(',').map(Number);
            map.setView([lat, lng], 14);
            L.circle([lat, lng], { color: '#ff0055', radius: 250 }).addTo(map);
            displayInspectorPanel("Coordinate Point", "Manual Input Layer", "Coordinate Pin", "N/A", "");
            return;
        }

        // Search through data fetched from GitHub
        let itemLocated = false;
        if (baseGithubLayer) {
            baseGithubLayer.eachLayer((layer) => {
                if (layer.feature.properties.name && layer.feature.properties.name.toLowerCase().includes(query.toLowerCase())) {
                    map.fitBounds(layer.getBounds());
                    showActiveHighlight(layer, layer.feature.properties);
                    itemLocated = true;
                }
            });
        }

        if (!itemLocated) {
            // Check dynamic entries saved inside Supabase if missing from GitHub
            const { data, error } = await supabase.from('orlegeo_map_objects').select('*').ilike('name', `%${query}%`).maybeSingle();
            if (data) {
                const geometryLayer = L.geoJSON(data.geom);
                map.fitBounds(geometryLayer.getBounds());
                displayInspectorPanel(data.name, data.layer_type, data.category, data.reference_number, data.image_url, data.dimensions);
            } else {
                alert("Location not found in database.");
            }
        }
    }

    function showActiveHighlight(layer, props) {
        layer.setStyle({ color: '#ff0055', weight: 4, fillOpacity: 0.3 });
        setTimeout(() => { baseGithubLayer.resetStyle(layer); }, 5000);

        displayInspectorPanel(
            props.name || "Unnamed Area",
            "GitHub File Source",
            props.category || "County / District Space",
            props.id || "N/A",
            props.image_link || ""
        );
    }

    function displayInspectorPanel(name, layer, cat, ref, imgUrl, dimensions = {}) {
        document.getElementById('inspector').style.display = 'block';
        document.getElementById('inspect-name').innerText = name;
        document.getElementById('inspect-layer').innerText = layer;
        document.getElementById('inspect-category').innerText = cat;
        document.getElementById('inspect-ref').innerText = ref;

        let measurementsBox = document.getElementById('inspect-dimensions');
        if (Object.keys(dimensions).length > 0) {
            measurementsBox.style.display = 'block';
            measurementsBox.innerHTML = `<strong>Measurements Data:</strong><br>` + Object.entries(dimensions).map(([k,v]) => `${k.toUpperCase()}: ${v}`).join('<br>');
        } else {
            measurementsBox.style.display = 'none';
        }

        let imagePlaceholder = document.getElementById('inspect-image');
        if (imgUrl && imgUrl.startsWith('http')) {
            imagePlaceholder.src = imgUrl;
            imagePlaceholder.style.display = 'block';
        } else {
            imagePlaceholder.style.display = 'none';
        }
    }

    function closeDrawingWorkflow() {
        document.getElementById('creator-panel').style.display = 'none';
        drawnItemsGroup.clearLayers();
    }
</script>
</body>
</html>
